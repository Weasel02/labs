name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build
        run: |
          cd src
          make
          mkdir -p ../usr/bin
          cp fibonacci ../usr/bin/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: usr/bin/fibonacci

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: usr/bin/

      - name: Make executable
        run: chmod +x usr/bin/fibonacci

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run tests
        run: |
          cd cicd
          FIB_BIN="../usr/bin/fibonacci" ./test.sh
  package:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: usr/bin/

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dh-make debhelper

      - name: Create .deb package
        run: |
          mkdir -p debian/DEBIAN
          cp DEBIAN/control debian/DEBIAN/
          mkdir -p debian/usr/bin
          cp usr/bin/fibonacci debian/usr/bin/
          dpkg-deb --build debian
          mkdir -p artifacts
          mv debian.deb artifacts/fibonacci_1.0_amd64.deb

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fibonacci-package
          path: artifacts/
  deploy:
     needs: package
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       
       - name: Download .deb artifact
         uses: actions/download-artifact@v4
         with:
           name: fibonacci-package
           path: artifacts/
 
       - name: Set up Docker
         uses: docker/setup-buildx-action@v2
 
       - name: Build Docker image
         run: |
           cp artifacts/fibonacci_1.0_amd64.deb .
           docker build -t fibonacci-app .
 
       - name: Run container
         run: |
           docker run --rm fibonacci-app 10
